[project]
name = "municipal-economic-profiles"
version = "0.1.0"
description = "Reproducible robustness study of dynamic municipal consumer-profile similarity networks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "duckdb>=1.2,<2",
  "igraph>=0.11,<2",
  "leidenalg>=0.10,<1",
  "matplotlib>=3.9,<4",
  "pyyaml>=6,<7",
  "threadpoolctl>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "networkx>=3,<4"]
presentation = ["reportlab>=4.4,<5"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/municipal_profiles"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
link-mode = "copy"
